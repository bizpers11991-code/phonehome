# phonehome next to a Pi-hole installed on this host. phonehome only ever
# reads Pi-hole's files; the mount is read-only.
#
#   echo "PIHOLE_GID=$(stat -c %g /etc/pihole/pihole-FTL.db)" > .env
#   docker compose up -d   →   http://<this-host>:8099
services:
  phonehome:
    image: ghcr.io/bizpers11991-code/phonehome:latest
    container_name: phonehome
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - phonehome-data:/data
      - /etc/pihole:/etc/pihole:ro
      # Optional config file; without it sources are auto-detected.
      # - ./phonehome.yaml:/config/phonehome.yaml:ro

      # AdGuard Home instead of Pi-hole: mount its data directory instead.
      # - /opt/AdGuardHome/data:/opt/AdGuardHome/data:ro
    environment:
      TZ: Etc/UTC # set to your zone so "overnight" means your night
      # The image sets GOMEMLIMIT=128MiB so reports fit next to Pi-hole on a
      # small Pi; raise it (or set "off") on a machine with RAM to spare.
      # GOMEMLIMIT: 256MiB
    # Pi-hole lets only its own group read pihole-FTL.db, and that group's
    # number differs from host to host. Set PIHOLE_GID to the output of
    # `stat -c %g /etc/pihole/pihole-FTL.db`, e.g. in a .env file next to this
    # one (see the top of this file).
    group_add: ["${PIHOLE_GID:?set PIHOLE_GID to the output of: stat -c %g /etc/pihole/pihole-FTL.db}"]

    # Connection data (conntrack) only exists in the host's network namespace.
    # To see flows (e.g. devices bypassing your DNS) use host networking and
    # drop the "ports:" section above:
    # network_mode: host

volumes:
  phonehome-data:
