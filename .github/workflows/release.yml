name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race ./...
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for p in linux/amd64 linux/arm64 linux/arm/7 linux/arm/6 darwin/arm64 darwin/amd64; do
            os=${p%%/*}; rest=${p#*/}; arch=${rest%%/*}; arm=""; name="$os-$arch"
            if [ "$arch" = arm ]; then arm=${rest#*/}; name="${name}v$arm"; fi
            dir="phonehome_${VERSION}_${name}"
            mkdir -p "dist/$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$dir/phonehome" ./cmd/phonehome
            cp LICENSE* README* packaging/phonehome.example.yaml "dist/$dir/" 2>/dev/null || true
            cp -r packaging/systemd "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
            rm -rf "dist/$dir"
          done
          cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS
      # Homebrew formula and AUR PKGBUILD, attached to the release for the
      # tap / AUR maintainer to copy. No tap or AUR credentials live here.
      - name: render package manifests
        if: ${{ !contains(github.ref_name, '-') }}
        run: sh packaging/render.sh "${{ github.ref_name }}" dist/SHA256SUMS dist/manifests
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          extra=""
          if [ -d dist/manifests ]; then extra="dist/manifests/phonehome.rb dist/manifests/PKGBUILD"; fi
          # The notes are the tag's CHANGELOG section, with its relative links
          # made absolute so they work on the release page.
          awk -v tag="## $TAG" '$0 == tag {f=1; next} /^## /{f=0} f' CHANGELOG.md |
            sed -E "s#\]\((docs|scripts|kb|packaging)/#](https://github.com/$REPO/blob/$TAG/\1/#g" > dist/notes.md
          # shellcheck disable=SC2086 # $extra is a list of paths without spaces
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS $extra --title "$TAG" --notes-file dist/notes.md --generate-notes --verify-tag

  image:
    needs: binaries # no image for a tag whose tests fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build provenance and an SPDX SBOM, stored as attestations
          # next to the image (`docker buildx imagetools inspect --format
          # '{{ json .SBOM }}' ghcr.io/bizpers11991-code/phonehome`).
          provenance: mode=max
          sbom: true
