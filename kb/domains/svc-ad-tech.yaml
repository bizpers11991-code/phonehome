  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/indexww.com.json
- pattern: 3lift.com
  company: triplelift
  category: ads
  purpose: TripleLift native and connected-TV ad exchange.
  confidence: medium
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/3lift.com.json
- pattern: teads.tv
  company: teads
  category: ads
  purpose: 'Teads video ad platform: serves and measures video ads.'
