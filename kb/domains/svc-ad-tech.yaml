  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/casalemedia.com.json
- pattern: indexww.com
  company: index-exchange
  category: ads
  purpose: Index Exchange ad exchange scripts and event tracking.
  confidence: medium
