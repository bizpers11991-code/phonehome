# Cross-cutting services: SDKs, ad tech, measurement, streaming, CDNs and
# infrastructure found inside many devices. Owned by the services KB contributor.
rules:
- pattern: fwmrm.net
  company: freewheel
  category: ads
  purpose: 'FreeWheel ad server: picks and tracks the video ads shown inside streaming TV apps.'
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/fwmrm.net.json
- pattern: stickyadstv.com
  company: freewheel
  category: ads
  purpose: FreeWheel (StickyADS.tv) video ad exchange; seen in Roku channels.
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/stickyadstv.com.json
  - https://arxiv.org/abs/1911.03447
- pattern: innovid.com
  company: innovid
  category: ads
  purpose: Innovid serves and measures video and connected-TV ads.
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/innovid.com.json
  - https://arxiv.org/abs/1911.03447
- pattern: adsrvr.org
  company: the-trade-desk
  category: ads
  purpose: 'The Trade Desk ad buying platform: ad bidding, ID matching and ad tracking.'
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/adsrvr.org.json
  - https://arxiv.org/abs/1911.03447
- pattern: pubmatic.com
  company: pubmatic
  category: ads
  purpose: 'PubMatic ad exchange: auctions ad slots in apps and sites, syncing user IDs with bidders.'
  confidence: medium
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/pubmatic.com.json
- pattern: rubiconproject.com
  company: magnite
  category: ads
  purpose: 'Magnite (Rubicon Project) ad exchange: auctions ad slots and syncs user IDs with bidders.'
  confidence: medium
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/rubiconproject.com.json
- pattern: spotxchange.com
  company: magnite
  category: ads
  purpose: 'SpotX (Magnite) video ad platform: serves and tracks video ads; very common on Roku.'
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/spotxchange.com.json
  - https://arxiv.org/abs/1911.03447
- pattern: tremorhub.com
  company: magnite
  category: ads
  purpose: 'Telaria (Magnite) connected-TV ad platform: serves and tracks video ads.'
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/tremorhub.com.json
  - https://arxiv.org/abs/1911.03447
- pattern: springserve.com
  company: magnite
  category: ads
  purpose: SpringServe (Magnite) video ad server used by connected-TV apps.
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/springserve.com.json
  - https://arxiv.org/abs/1911.03447
- pattern: openx.net
  company: openx
  category: ads
  purpose: 'OpenX ad exchange: auctions ad slots and syncs user IDs with bidders.'
  confidence: medium
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/openx.net.json
- pattern: criteo.com
  company: criteo
  category: ads
  purpose: 'Criteo retargeting ads: shows ads based on products you browsed elsewhere.'
  confidence: medium
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/criteo.com.json
- pattern: criteo.net
  company: criteo
  category: ads
  purpose: Criteo retargeting ad scripts and measurement.
  confidence: medium
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/criteo.net.json
- pattern: casalemedia.com
  company: index-exchange
