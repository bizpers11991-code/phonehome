# Cross-cutting services: SDKs, ad tech, measurement, streaming, CDNs and
# infrastructure found inside many devices. Owned by the services KB contributor.
rules:
- pattern: netflix.com
  company: netflix
  category: content
  purpose: 'Netflix app and service APIs: sign-in, browsing and playback control.'
  confidence: high
  evidence:
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
  - https://arxiv.org/abs/1911.03447
- pattern: netflix.net
  company: netflix
  category: content
  purpose: Netflix service infrastructure.
  confidence: high
  evidence:
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
- pattern: nflxvideo.net
  company: netflix
  category: content
  purpose: Netflix video streams from Open Connect servers, often hosted inside your internet provider.
  confidence: high
  evidence:
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
  - https://arxiv.org/abs/1911.03447
- pattern: nflxso.net
  company: netflix
  category: content
  purpose: Netflix artwork and app assets.
  confidence: high
  evidence:
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
  - https://arxiv.org/abs/1911.03447
- pattern: nflxext.com
  company: netflix
  category: content
  purpose: Netflix app code and static assets.
  confidence: high
  evidence:
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
  - https://help.netflix.com/en/node/124410
- pattern: nflximg.com
  company: netflix
  category: content
  purpose: Netflix images and app assets.
  confidence: high
  evidence:
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
  - https://arxiv.org/abs/1911.03447
- pattern: nflximg.net
  company: netflix
  category: content
  purpose: Netflix images and app assets.
  confidence: high
  evidence:
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
- pattern: nflxsearch.net
  company: netflix
  category: content
  purpose: Netflix search service.
  confidence: medium
  evidence:
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
- pattern: netflix.com.edgesuite.net
  company: netflix
  category: content
  purpose: Netflix content delivered through Akamai.
  confidence: medium
  evidence:
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
- pattern: ichnaea.netflix.com
  company: netflix
  category: telemetry
  purpose: Netflix app event logging endpoint, contacted often by TVs running Netflix; exact payload is not public.
  confidence: low
  evidence:
  - https://arxiv.org/abs/1911.03447
  - https://github.com/AdguardTeam/HostlistsRegistry/blob/main/services/netflix.yml
- pattern: disneyplus.com
  company: disney
