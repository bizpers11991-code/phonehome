# Cross-cutting services: SDKs, ad tech, measurement, streaming, CDNs and
# infrastructure found inside many devices. Owned by the services KB contributor.
rules:
- pattern: cloudflare-dns.com
  company: cloudflare
  category: essential
  purpose: Encrypted DNS resolver (Cloudflare 1.1.1.1); a device using it can bypass your local DNS filtering.
  confidence: high
  evidence:
  - https://developers.cloudflare.com/1.1.1.1/setup/
- pattern: mozilla.cloudflare-dns.com
  company: cloudflare
  category: essential
  purpose: Encrypted DNS resolver (Firefox's default DoH via Cloudflare); a device using it can bypass your local DNS filtering.
  confidence: high
  evidence:
  - https://wiki.mozilla.org/Trusted_Recursive_Resolver
- pattern: one.one.one.one
  company: cloudflare
  category: essential
  purpose: Encrypted DNS resolver (Cloudflare 1.1.1.1 DoT name); a device using it can bypass your local DNS filtering.
  confidence: high
  evidence:
  - https://developers.cloudflare.com/1.1.1.1/encryption/dns-over-tls/
- pattern: dns.quad9.net
