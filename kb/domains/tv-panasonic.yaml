# Panasonic TVs running My Home Screen (Panasonic's own TV OS).
# Most myhomescreen.tv hosts seen in the wild are collect-*/usage-* data
# uploads; the mhc-* app-start hosts are needed for apps to load.
company: panasonic
rules:
  - pattern: myhomescreen.tv
    category: telemetry
    purpose: Panasonic My Home Screen domain. A blocklist treats its collect and usage hosts as data uploads; other hosts here are unverified, and some are needed.
    confidence: low
    kind_hint: tv
    evidence:
      - https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
  - pattern: mhc-ajax-eu.myhomescreen.tv
    category: essential
    purpose: My Home Screen app-start service; TVs report no internet connection when it is blocked.
    confidence: low
    kind_hint: tv
    evidence:
      - https://github.com/Okazakee/tv-dns-blocklist/blob/main/blocklist.txt
  - pattern: mhc-xpana-eu.myhomescreen.tv
    category: essential
    purpose: My Home Screen app-start service; TVs report no internet connection when it is blocked.
    confidence: low
    kind_hint: tv
    evidence:
      - https://github.com/Okazakee/tv-dns-blocklist/blob/main/blocklist.txt
  - pattern: mhc-eu.myhomescreen.tv
    category: essential
    purpose: My Home Screen service that a TV blocklist keeps reachable (TV internet connectivity); Panasonic TVs may report no internet or fail to start apps if blocked.
    confidence: low
