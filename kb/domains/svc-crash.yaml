# Cross-cutting services: SDKs, ad tech, measurement, streaming, CDNs and
# infrastructure found inside many devices. Owned by the services KB contributor.
rules:
- pattern: ingest.sentry.io
  company: sentry
  category: telemetry
  purpose: 'Sentry error reporting: the app sends crash reports and diagnostics, which can include device details.'
  confidence: high
  evidence:
  - https://docs.sentry.io/security-legal-pii/security/ip-ranges/
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/sentry.io.json
- pattern: sentry.io
  company: sentry
  category: telemetry
  purpose: Sentry error and performance monitoring (website, API and legacy event intake).
  confidence: medium
  evidence:
  - https://docs.sentry.io/security-legal-pii/security/ip-ranges/
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/sentry.io.json
- pattern: sentry-cdn.com
  company: sentry
  category: telemetry
  purpose: Sentry SDK scripts served from Sentry's CDN for error reporting.
  confidence: medium
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/sentry-cdn.com.json
- pattern: bugsnag.com
  company: bugsnag
  category: telemetry
  purpose: 'BugSnag crash reporting: the app sends errors and session starts for stability monitoring.'
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/bugsnag.com.json
  - https://github.com/bugsnag/bugsnag-android/blob/next/bugsnag-android-core/src/main/java/com/bugsnag/android/EndpointConfiguration.kt
- pattern: browser-intake-datadoghq.com
  company: datadog
  category: telemetry
  purpose: 'Datadog RUM and log intake: the app reports usage sessions, errors and performance.'
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/browser-intake-datadoghq.com.json
  - https://docs.datadoghq.com/real_user_monitoring/guide/proxy-rum-data/
- pattern: browser-intake-datadoghq.eu
  company: datadog
  category: telemetry
  purpose: 'Datadog RUM and log intake (EU site): the app reports sessions, errors and performance.'
  confidence: high
  evidence:
  - https://docs.datadoghq.com/real_user_monitoring/guide/proxy-rum-data/
- pattern: browser-intake-us3-datadoghq.com
  company: datadog
  category: telemetry
  purpose: 'Datadog RUM and log intake (US3 site): the app reports sessions, errors and performance.'
  confidence: high
  evidence:
  - https://docs.datadoghq.com/real_user_monitoring/guide/proxy-rum-data/
- pattern: browser-intake-us5-datadoghq.com
  company: datadog
  category: telemetry
  purpose: 'Datadog RUM and log intake (US5 site): the app reports sessions, errors and performance.'
  confidence: high
  evidence:
  - https://docs.datadoghq.com/real_user_monitoring/guide/proxy-rum-data/
- pattern: browser-intake-ap1-datadoghq.com
  company: datadog
  category: telemetry
  purpose: 'Datadog RUM and log intake (AP1 site): the app reports sessions, errors and performance.'
  confidence: high
  evidence:
  - https://docs.datadoghq.com/real_user_monitoring/guide/proxy-rum-data/
- pattern: datadoghq.com
  company: datadog
  category: telemetry
  purpose: 'Datadog monitoring service: logs, metrics or app-performance data sent to the device or app maker.'
  confidence: medium
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/datadoghq.com.json
  - https://docs.datadoghq.com/getting_started/site/
- pattern: datadoghq.eu
  company: datadog
  category: telemetry
  purpose: 'Datadog monitoring service (EU): logs, metrics or app-performance data.'
  confidence: medium
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/datadoghq.eu.json
  - https://docs.datadoghq.com/getting_started/site/
- pattern: nr-data.net
  company: newrelic
  category: telemetry
  purpose: 'New Relic monitoring intake: the app reports performance, errors and usage to its maker.'
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/nr-data.net.json
  - https://docs.newrelic.com/docs/new-relic-solutions/get-started/networks/
- pattern: newrelic.com
  company: newrelic
  category: telemetry
  purpose: 'New Relic monitoring: app performance, crash and usage data; frequent on smart TVs.'
  confidence: high
  evidence:
  - https://github.com/duckduckgo/tracker-radar/blob/main/domains/US/newrelic.com.json
  - https://arxiv.org/abs/1911.03447
  - https://docs.newrelic.com/docs/new-relic-solutions/get-started/networks/
