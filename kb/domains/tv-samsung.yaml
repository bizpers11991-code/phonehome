      - https://github.com/Okazakee/tv-dns-blocklist/blob/main/blocklist.txt
  - pattern: samsungcloud.tv
    category: content
    purpose: Samsung TV cloud services, including Samsung TV Plus channel guides and artwork.
    confidence: low
    kind_hint: tv
    evidence:
      - https://github.com/Okazakee/tv-dns-blocklist/blob/main/blocklist.txt
