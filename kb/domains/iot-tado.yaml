company: tado
rules:
  - pattern: tado.com
    category: essential
    purpose: "tado cloud for smart thermostats and radiator valves; schedules, the app and geofencing depend on it."
    confidence: medium
    evidence:
      - https://psytester.github.io/tado_smart_radiator_thermostat/
  - pattern: ingress.tado.com
