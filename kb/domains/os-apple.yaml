  - pattern: osrecovery.apple.com
    category: essential
    purpose: macOS Recovery service.
    confidence: high
    kind_hint: computer
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: configuration.apple.com
    category: essential
    purpose: Rosetta 2 updates on Macs with Apple silicon.
    confidence: high
    kind_hint: computer
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: gdmf-ados.apple.com
    category: essential
    purpose: Software update catalog for additional operating-system components.
    confidence: high
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: gsra.apple.com
    category: essential
    purpose: Operating-system updates for additional components.
    confidence: high
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: bpapi.apple.com
    category: essential
    purpose: Enrolment in Apple beta software updates.
    confidence: high
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: ppq.apple.com
    category: essential
    purpose: Validates enterprise-distributed apps before they run.
    confidence: high
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: serverstatus.apple.com
    category: essential
    purpose: Lets devices find their public IP address so they can locate a local Apple content cache.
    confidence: high
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: apple-dns.net
    category: essential
