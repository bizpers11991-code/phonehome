# Apple hosts not covered by platform-apple.yaml, almost all from Apple's own
# "Use Apple products on enterprise networks" list.
company: apple
rules:
  # --- Essential: setup, sign-in, updates -----------------------------------
  - pattern: static.ips.apple.com
    category: essential
    purpose: Apple device setup support service.
    confidence: high
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: tbsc.apple.com
    category: essential
    purpose: Apple device setup support service.
    confidence: high
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: sq-device.apple.com
    category: essential
    purpose: eSIM activation on iPhone and iPad.
    confidence: high
    kind_hint: phone
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: account.apple.com
    category: essential
    purpose: Apple Account sign-in in Settings and System Settings.
    confidence: high
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: appleid.cdn-apple.com
    category: essential
    purpose: Apple Account sign-in content.
    confidence: high
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: ig.apple.com
    category: essential
    purpose: macOS software updates.
    confidence: high
    kind_hint: computer
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: skl.apple.com
    category: essential
    purpose: macOS software updates.
    confidence: high
    kind_hint: computer
    evidence:
      - https://support.apple.com/en-us/101555
  - pattern: swdownload.apple.com
    category: essential
