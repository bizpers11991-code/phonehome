  # --- Essential: Android / Play plumbing -----------------------------------
  - pattern: android.googleapis.com
    category: essential
    purpose: Android check-in and push registration; regular check-ins carry hardware, SIM and Android ID identifiers.
    confidence: medium
    evidence:
      - https://support.google.com/work/android/answer/10513641?hl=en
      - https://www.scss.tcd.ie/doug.leith/apple_google.pdf
  - pattern: android.clients.google.com
    category: essential
    purpose: Google Play and Android device check-in service; it also receives device identifiers such as the Android ID.
    confidence: medium
    evidence:
      - https://support.google.com/work/android/answer/10513641?hl=en
      - https://www.scss.tcd.ie/doug.leith/apple_google.pdf
  - pattern: android.apis.google.com
    category: essential
    purpose: Google Play and Android device policy service listed by Google as required for Android devices.
    confidence: medium
    evidence:
      - https://support.google.com/work/android/answer/10513641?hl=en
  - pattern: googlehomefoyer-pa.googleapis.com
    category: essential
    purpose: Google Home back end ("Foyer") that returns your home's device list and local-control tokens to the Google Home app.
    confidence: low
    evidence:
      - https://github.com/leikoilja/glocaltokens/blob/198157bf5f31ef35153bd624fe9dcfd3fb858a11/glocaltokens/const.py
      - https://github.com/leikoilja/glocaltokens/blob/198157bf5f31ef35153bd624fe9dcfd3fb858a11/glocaltokens/client.py
  - pattern: accounts.google.com
    category: essential
    purpose: Google account sign-in and authentication.
    confidence: high
    evidence:
      - https://support.google.com/chrome/a/answer/6334001?hl=en
      - https://support.google.com/work/android/answer/10513641?hl=en

