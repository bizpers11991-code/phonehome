  # --- Encrypted DNS -----------------------------------------------------------
  - pattern: dns.google
    category: essential
    purpose: Google Public DNS over HTTPS and TLS; a device using it can bypass your local DNS filtering.
    confidence: high
    evidence:
      - https://developers.google.com/speed/public-dns/docs/doh
      - https://developers.google.com/speed/public-dns/docs/dns-over-tls
