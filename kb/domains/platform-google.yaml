  # --- Telemetry ------------------------------------------------------------
  - pattern: play.googleapis.com
    category: telemetry
    purpose: Google Play services logging; measured sending about 1 MB of telemetry at setup even with usage reporting off.
    confidence: high
    evidence:
      - https://www.scss.tcd.ie/doug.leith/apple_google.pdf
  - pattern: firebaselogging.googleapis.com
    category: telemetry
    purpose: Firebase logging and metrics upload from Android and apps that use Firebase.
    confidence: high
    evidence:
      - https://support.google.com/work/android/answer/10513641?hl=en
  - pattern: firebaselogging-pa.googleapis.com
    category: telemetry
    purpose: Batch-log upload endpoint built into Firebase's Android data-transport library, which sends SDK logs and metrics to Google.
    confidence: high
    evidence:
      - https://github.com/firebase/firebase-android-sdk/blob/e51192421f7e05225acd3a568bd30f1e06b8e69d/transport/transport-backend-cct/src/main/java/com/google/android/datatransport/cct/CCTDestination.java
  - pattern: crashlytics.com
    category: telemetry
    purpose: Firebase Crashlytics crash reporting and its settings, built into many TV and phone apps.
    confidence: high
    evidence:
      - https://petsymposium.org/popets/2020/popets-2020-0021.pdf
      - https://www.princeton.edu/~pmittal/publications/tv-tracking-ccs19.pdf
      - https://github.com/firebase/firebase-android-sdk/issues/7309
  - pattern: crashlyticsreports-pa.googleapis.com
    category: telemetry
    purpose: Upload endpoint for Firebase Crashlytics crash reports.
    confidence: medium
    evidence:
      - https://github.com/firebase/flutterfire/issues/9352

  # --- Tracking / analytics -------------------------------------------------
  - pattern: app-measurement.com
    category: tracking
    purpose: Google Analytics for Firebase; logs app events tied to an app instance ID that is linked to the advertising ID.
    confidence: high
    evidence:
      - https://www.scss.tcd.ie/doug.leith/apple_google.pdf
      - https://github.com/Perflyst/PiHoleBlocklist/blob/master/android-tracking.txt
  - pattern: google-analytics.com
    category: tracking
    purpose: Google Analytics usage tracking, one of the most common trackers in streaming-device apps.
    confidence: high
    evidence:
      - https://www.princeton.edu/~pmittal/publications/tv-tracking-ccs19.pdf
      - https://www.scss.tcd.ie/doug.leith/apple_google.pdf

  # --- Ads ------------------------------------------------------------------
  - pattern: doubleclick.net
    category: ads
    purpose: Google ad serving and measurement (DoubleClick / Ad Manager), the most common tracker found in Roku channels.
    confidence: high
    evidence:
      - https://www.princeton.edu/~pmittal/publications/tv-tracking-ccs19.pdf
      - https://petsymposium.org/popets/2020/popets-2020-0021.pdf
  - pattern: googlesyndication.com
    category: ads
    purpose: Google ad serving for apps and websites (AdSense / AdMob).
    confidence: high
    evidence:
      - https://www.princeton.edu/~pmittal/publications/tv-tracking-ccs19.pdf
      - https://www.scss.tcd.ie/doug.leith/apple_google.pdf
  - pattern: googleadservices.com
    category: ads
    purpose: Google ad conversion tracking; the YouTube app was seen sending the advertising ID here.
    confidence: high
    evidence:
      - https://www.scss.tcd.ie/doug.leith/apple_google.pdf
      - https://github.com/Perflyst/PiHoleBlocklist/blob/master/android-tracking.txt
  - pattern: imasdk.googleapis.com
    category: ads
    purpose: Google Interactive Media Ads SDK that inserts video ads into streaming apps.
    confidence: high
    evidence:
      - https://www.princeton.edu/~pmittal/publications/tv-tracking-ccs19.pdf

