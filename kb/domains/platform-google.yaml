# Google / Alphabet: Android, Google TV, Chromecast, Firebase, ads, YouTube.
# Much of this is essential plumbing (connectivity checks, time, push, updates).
# Sources: Google's own allowlists (Android Enterprise, ChromeOS, FCM), AOSP,
# the open-source Chromecast (Cast shell) and Firebase SDK code on GitHub,
# Leith "Mobile Handset Privacy" (SecureComm 2021), Moghaddam et al. CCS 2019,
# Varmarken et al. PETS 2020.
company: google
rules:
  # --- Essential: connectivity checks -------------------------------------
  - pattern: connectivitycheck.gstatic.com
    category: essential
    purpose: Android and ChromeOS connectivity check (generate_204) that detects captive portals; contains no personal data.
    confidence: high
    evidence:
      - https://android.googlesource.com/platform/packages/modules/NetworkStack/+/refs/heads/main/res/values/config.xml
      - https://support.google.com/work/android/answer/10513641?hl=en
      - https://github.com/chromium/chromium/blob/a503bcd2433058f2aa728d4676f22f655ce56768/chromecast/net/connectivity_checker_impl.h
  - pattern: connectivitycheck.android.com
    category: essential
    purpose: Android connectivity check used to tell whether the network has working internet access.
    confidence: high
    evidence:
      - https://support.google.com/work/android/answer/10513641?hl=en
      - https://support.google.com/chrome/a/answer/6334001?hl=en
  - pattern: clients3.google.com
    category: essential
    purpose: Google endpoint used by ChromeOS, Chromecast and other Google devices for clock sync and connectivity probing.
    confidence: high
    evidence:
      - https://support.google.com/chrome/a/answer/6334001?hl=en
      - https://github.com/chromium/chromium/blob/a503bcd2433058f2aa728d4676f22f655ce56768/chromecast/net/net_switches.cc
  - pattern: clients2.google.com
    category: essential
    purpose: Serves Chrome extension updates and receives Chromecast crash reports; blocking it stops extension updates.
    confidence: high
    evidence:
      - https://github.com/chromium/chromium/blob/a503bcd2433058f2aa728d4676f22f655ce56768/extensions/common/extension_urls.cc
      - https://github.com/chromium/chromium/blob/a503bcd2433058f2aa728d4676f22f655ce56768/chromecast/crash/linux/minidump_uploader.cc
      - https://github.com/chromium/chromium/blob/a503bcd2433058f2aa728d4676f22f655ce56768/chromecast/browser/android/apk/src/org/chromium/chromecast/shell/CastCrashUploader.java

