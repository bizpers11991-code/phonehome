company: ecovacs
rules:
  - pattern: ecouser.net
    category: essential
    purpose: "Ecovacs robot cloud (login, REST, XMPP and MQTT); Deebot app control and scheduling stop if blocked."
    confidence: medium
    kind_hint: vacuum
    evidence:
      - https://github.com/bmartin5692/bumper/blob/master/docs/DNS_Setup.md
      - https://github.com/kushagharahi/ecovacs-privacy-control
