# SmartThings belongs to Samsung; the samsung company is defined by the TV group.
company: samsung
rules:
  - pattern: connect.smartthings.com
    category: essential
    purpose: "SmartThings hub cloud connection (regional dc-*.connect hosts); hub automations that run in the cloud and the app stop if blocked."
    confidence: medium
    kind_hint: hub
    evidence:
      - https://community.smartthings.com/t/smartthings-firewalling-serious-security-concerns/121724
  - pattern: fw.dc.connect.smartthings.com
    category: essential
    purpose: "SmartThings hub firmware delivery; hubs stop receiving updates if blocked."
    confidence: medium
    kind_hint: hub
    evidence:
      - https://community.smartthings.com/t/smartthings-firewalling-serious-security-concerns/121724
  - pattern: fw-update.smartthings.com
    category: essential
    purpose: "SmartThings hub firmware update check; hubs stop receiving updates if blocked."
    confidence: low
    kind_hint: hub
    evidence:
      - https://community.smartthings.com/t/smartthings-firewalling-serious-security-concerns/121724
  - pattern: fw-update2.smartthings.com
    category: essential
    purpose: "Alternate SmartThings hub firmware update server; hubs stop receiving updates if blocked."
    confidence: low
    kind_hint: hub
    evidence:
      - https://community.smartthings.com/t/smartthings-firewalling-serious-security-concerns/121724
  - pattern: api.smartthings.com
    category: essential
    purpose: "SmartThings cloud API for devices, scenes and events; remote control stops if blocked."
    confidence: medium
    kind_hint: hub
    evidence:
      - https://github.com/andrewsayre/pysmartthings/blob/d800cd231f12b09d2958afab557bae6588e3db53/src/pysmartthings/const.py#L5
  - pattern: auth-global.api.smartthings.com
    category: essential
    purpose: "SmartThings account sign-in token service used by Home Assistant's SmartThings integration."
    confidence: medium
    kind_hint: hub
    evidence:
      - https://github.com/home-assistant/core/blob/3b1cab025bcbd9dab4a35c40d013b41e8f51566e/homeassistant/components/smartthings/application_credentials.py#L33
